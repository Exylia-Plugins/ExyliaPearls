import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.11'
    id("io.freefair.lombok") version "8.14"
    id 'com.lukittu.sdk' version 'v1.0.10-local'
}

def pluginName = 'ExyliaPearls'
def mainPackage = 'net.exylia'
def fullPackage = "${mainPackage}.exyliaPearls"
def outputDirectory = "/home/coder/projects/jars"

group = mainPackage
version = '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
}

dependencies {
    implementation("${mainPackage}:ExyliaCommons:1.0.0")
    compileOnly 'com.lukittu.loader:lukittu-common:v1.0.10-local'
    compileOnly 'com.lukittu.loader:lukittu-spigot:v1.0.10-local'
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    compileOnly 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    compileOnly 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
    compileOnly 'io.github.revxrsal:lamp.brigadier:4.0.0-rc.17'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveBaseName.set(pluginName)
    archiveClassifier.set('')
    destinationDirectory = file("/home/coder/projects/jars/plugins")
    minimize()
    exclude 'com/lukittu/**'
    exclude 'de/exlll/**'
    exclude 'org/snakeyaml/**'
    exclude 'org/yaml/**'
    relocate "${mainPackage}.commons", "${fullPackage}.shadow.commons"
}

tasks.register('cleanTarget', Delete) {
    delete 'target/'
}

clean.dependsOn cleanTarget

tasks.register('buildAll') {
    dependsOn clean, shadowJar
    group = 'build'
    description = 'Builds the plugin JAR and the Lukittu loader JAR'
    doLast {
        exec {
            workingDir project.rootDir
            commandLine System.getProperty("os.name").toLowerCase().contains("windows") ? ['cmd', '/c', 'gradlew.bat', 'assembleLoaderJar'] : ['./gradlew', 'assembleLoaderJar']
        }
    }
}

lukittu {
    platform.set('spigot')
    mainClass.set('net.exylia.exyliaPearls.ExyliaPearls')
    productId.set('b2f7b53c-9c4e-46b3-9e29-67b8aa4e33bb')
    teamId.set('824ea588-c7b2-4cf3-b9af-25cff6b5385c')
    loaderVersion.set('v1.0.10-local')
    configHeader.set('Request your license in https://discord.exylia.net')
    lukittuBranch.set('spigot')
    publicKey.set('')
    outputLoaderJarPath.set("/home/coder/projects/jars/loaders/Exylia-Pearls-Loader.jar")
    resourcePaths.set([
        "src/loader/resources/plugin.yml": "plugin.yml"
    ])

    release {
        dependsOn(project.tasks.named('shadowJar'))
        injars(project.tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile })
        authorization.set("c1eadb685a61714e6ecc9e9a6f8e95e912944359f2da63fb145493b855672204")
        status.set("PUBLISHED")
        setAsLatest.set(true)
        branchId.set("03dc4934-0f8d-470c-ab1e-665b72cb64e0")
    }
}
