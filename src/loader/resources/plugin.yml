name: ExyliaPearls
version: 1.0.0
main: com.lukittu.loader.spigot.SpigotLukittuLoader
api-version: '1.21'
authors: [ DiGround ]
website: https://link.exylia.net/@services
folia-supported: true

softdepend:
  # Soft on purpose: a hard depend stops this plugin from loading when
  # ExyliaLib is absent, and the loader that would install ExyliaLib is
  # exactly what has to load for the install to happen.
  - ExyliaLib

libraries:
  - 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
  - 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
